name: Publish SAFARIUM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: Combine game and card folders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          output = Path('_site')
          shutil.copytree('01_UPLOAD_GAME', output, dirs_exist_ok=True)

          parts = [
              '01_UI',
              '02_M01-M16',
              '03_M17-M32',
              '04_M33-M48',
              '05_M49-M64',
              '06_S01-S16',
              '07_S17-S32'
          ]

          for part in parts:
              shutil.copytree(
                  Path(part) / 'assets',
                  output / 'assets',
                  dirs_exist_ok=True
              )

          required = [
              'index.html',
              'rulebook.html',
              'encyclopedia.html',
              'assets/board.webp',
              'assets/interface/home.webp'
          ]

          required += [
              f'assets/cards-current/{prefix}{i:02d}.webp'
              for prefix, count in [('M', 64), ('S', 32)]
              for i in range(1, count + 1)
          ]

          for file in required:
              assert (output / file).is_file(), f'Missing: {file}'

          (output / '.nojekyll').touch()
          print('SAFARIUM is ready')
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
