 "instinct": "同じマスに他の味方草食動物がいなければ基本支配力1。", "roleCondition": "メインのみ。条件成立時の反応。", "biology": "混群で周囲の警戒に役立つことが知られる。", "sources": ["https://zoo.sandiegozoo.org/animals/zebra"], "image": "assets/cards-current/M29.webp", "why": "群れや混群で周囲を警戒する姿を、同じエリアの草食の味方への防護にしました。", "play": "草食同士で組み、メインの反応枠を誰に使うかを選びます。", "boundary": "警戒行動を直接の防護へ置き換えた創作です。", "runtimeStatus": "implemented"}, "M30": {"id": "M30", "name": "トナカイ", "kind": "main", "status": "active", "power": 2, "foodCost": 1, "terrain": "草原", "ability": "【自分の進出宣言時】川沿いでない出発地から、2マス先まで進出できる。", "instinct": "川沿いからは通常進出のみ。", "roleCondition": "メイン・遊撃（自発進出は遊撃へ交代後）。自分が進出する際に発動。", "biology": "季節に応じて長距離を移動する集団がいる。", "sources": ["https://animaldiversity.org/accounts/Rangifer_tarandus/"], "image": "assets/cards-current/M30.webp", "why": "長距離を移動する集団のイメージを、低いエサで使える跳躍にしました。", "play": "川沿い以外を出発地にすると、移動の強みが出ます。", "boundary": "現実のトナカイが川を渡れないという意味ではありません。", "runtimeStatus": "implemented"}, "M31": {"id": "M31", "name": "チンパンジー", "kind": "main", "status": "active", "power": 2, "foodCost": 2, "terrain": "森林", "ability": "【獲得行動のピック前】動物を獲得する前に、市場1枚を更新する。", "instinct": "同じマスに他の味方がいなければ基本支配力1。", "roleCondition": "メインのみ。自分の獲得行動前。", "biology": "枝を加工してシロアリを取るなど、地域ごとの道具使用が知られる。", "sources": ["https://animals.sandiegozoo.org/animals/chimpanzee"], "image": "assets/cards-current/M31.webp", "why": "道具を使い食べ物を得る柔軟さを、市場の選択肢を更新する効果にしました。", "play": "他の味方と組めばメインの基本支配力2。単独では1です。", "boundary": "市場の更新も単独時の数値低下も、認知や社会性を基にした創作です。", "runtimeStatus": "implemented"}, "M32": {"id": "M32", "name": "カバ", "kind": "main", "status": "active", "power": 3, "foodCost": 3, "terrain": "水辺", "ability": "【敵がいるマスへ入る前】自分のいる川沿いマスへの敵の進出を阻止する。", "instinct": "川沿い以外では基本支配力1。", "roleCondition": "メインのみ。条件成立時の反応。", "biology": "水辺で暮らし、特に水中で縄張りを主張することがある。", "sources": ["https://animals.sandiegozoo.org/animals/hippo"], "image": "assets/cards-current/M32.webp", "why": "水辺で縄張りを主張する姿を、水辺への敵の進出を阻む効果にしました。", "play": "支配力3で水辺を守る大型のメイン候補。", "boundary": "川沿い以外の支配力1は調整です。実際には陸でも活動します。", "runtimeStatus": "implemented"}, "S01": {"id": "S01", "name": "ワタリガラス", "kind": "support", "status": "active", "power": null, "foodCost": null, "terrain": null, "ability": "【ピック前】市場の動物1〜2枚を更新する。", "instinct": "使い切り。使用後は共通捨て札へ。", "roleCondition": "盤上の役割を持たない。手札から使用。", "biology": "ワタリガラスには、複雑な社会的行動や問題解決能力が知られる。", "sources": ["https://academy.allaboutbirds.org/crows-and-ravens/"], "image": "assets/cards-current/S01.webp", "why": "学習能力の高い鳥という着想を、候補を探し直す市場更新にしました。", "play": "市場を2枚まで入れ替え、獲得前の選択肢を広げます。", "boundary": "カラス類全体の能力を全てワタリガラス固有の行動と混同しない設計です。", "runtimeStatus": "implemented"}, "S02": {"id": "S02", "name": "ハヤブサ", "kind": "support", "status": "active", "power": null, "foodCost": null, "terrain": null, "ability": "【出動宣言時】今回の進出に反応する敵の定着能力1つを封印する。", "instinct": "使い切り。使用後は共通捨て札へ。", "roleCondition": "盤上の役割を持たない。手札から使用。", "biology": "速い急降下で獲物を捕まえる猛禽類として知られる。", "sources": ["https://www.allaboutbirds.org/guide/Peregrine_Falcon/overview"], "image": "assets/cards-current/S02.webp", "why": "高速で獲物に迫るイメージを、敵の反応を先に封じる支援にしました。", "play": "今回の進出に反応する能力1つが対象です。", "boundary": "実際に他の動物の能力を封印するものではありません。", "runtimeStatus": "implemented"}, "S03": {"id": "S03", "name": "フクロウ", "kind": "support", "status": "active", "power": null, "foodCost": null, "terrain": null, "ability": "【出動宣言時】味方1体は、隣接を無視して進出できる。", "instinct": "使い切り。使用後は共通捨て札へ。", "roleCondition": "盤上の役割を持たない。手札から使用。", "biology": "夜行性の種が多く、暗所での狩りに適応した感覚を持つ。", "sources": ["https://www.allaboutbirds.org/guide/barn_owl/overview"], "image": "assets/cards-current/S03.webp", "why": "空を移動するイメージを、隣接にとらわれない進出支援にしました。", "play": "目的地の配置枠や川通行など、残る条件は現行ルールで確認します。", "boundary": "地形を無制限に無視する生態を示すものではありません。", "runtimeStatus": "implemented"}, "S04": {"id": "S04", "name": "ウツボ", "kind": "support", "status": "active", "power": null, "foodCost": null, "terrain": null, "ability": "【出動宣言時】川沿いへの進出を阻む効果を1つ突破する。", "instinct": "使い切り。使用後は共通捨て札へ。", "roleCondition": "盤上の役割を持たない。手札から使用。", "biology": "岩やサンゴの隙間を利用する狩りが得意で、ハタとの共同狩猟も観察されている。", "sources": ["https://pubmed.ncbi.nlm.nih.go function battleNormalUI(){const p=visiblePlayer(),count=Object.values(s.board).filter(a=>a.controller===p).length,central=Object.values(s.board).filter(a=>a.controller===p&&a.points===2).length,bench=Object.values(s.animals).filter(u=>u.owner===p&&u.role==='bench').length;return `<div class="action-intro"><span class="panel-kicker">${isHumanDecision()?'あなたの手番':'相手の手番'}</span><h2>${isHumanDecision()?'どう動く？':'相手の行動中'}</h2></div>${isHumanDecision()?`<div class="action-tiles"><button id="chooseAnimal" class="action-tile action-tile-primary" aria-label="動物を進出させる"><span class="action-symbol">${panelGlyph('paw')}</span><span><strong>進出</strong><small>遊撃を移動</small></span><span class="action-cost">${panelGlyph('power')}<span>1行動</span></span>${panelGlyph('move')}</button><button data-tab="market" class="action-tile"><span class="action-symbol">${panelGlyph('cards')}</span><span><strong>獲得</strong><small>市場 ${s.market.length}枚</small></span><span class="action-cost">${panelGlyph('power')}<span>1行動</span></span></button><button data-tab="bench" class="action-tile" ${bench?'':'disabled title="待機場に動物がいません"'}><span class="action-symbol">${panelGlyph('return')}</span><span><strong>復帰</strong><small>待機場 ${bench}体</small></span><span class="action-cost">${panelGlyph('power')}<span>1行動</span></span></button></div><button id="roleMode" class="role-route">${panelGlyph('role')}<span>役割変更</span><small>行動 0</small>${panelGlyph('move')}</button>${mainAbilitiesUI()}`:`<p class="quick-tip">盤面とカードを確認できます。</p><button id="cpuResume" class="gold-button" ${cpuRunning?'disabled':''}>${cpuRunning?'CPU進行中':'CPUを進める'}</button>`}<p class="panel-hint">${panelGlyph('info')}マスを押すとエリア情報</p><details class="strategy-details panel-disclosure"><summary>得点と支配のしくみ</summary><div class="summary-line"><span>確定支配</span><b>${count}エリア</b></div><div class="summary-line"><span>中央2点エリア</span><b>${central}エリア</b></div><p class="muted">勝利点は現在の確定支配点。蓄積しません。目標${targetScore()}点・ラウンド終了時に判定します。${panelGlyph('power')}1＝1行動。通常の進  if(id==='reserveScout'){movementPermits=[{card:'S32',target:val('scoutPlayer')}];movementSupport='';declarationQueue=[];arrivalQueue=[];moveCache=null;render();return;}
 if(id==='reserveAmbush'){arrivalQueue=[{card:'S28',target:val('ambushTarget')}];movementPermits=[];movementSupport='';declarationQueue=[];moveCache=null;render();return;}
 const practice=e.target.closest('[data-practice]');
 if(practice){const value=practice.dataset.practice;if(tutorialStep===1)tutorialCards=tutorialCards.includes(value)?tutorialCards.filter(x=>x!==value):[...tutorialCards,value];else tutorialChoice=value;render();return;}
 if(id==='tutorialNext'&&tutorialReady()){tutorialStep++;tutorialChoice='';tutorialCards=[];render();return;}
 if(id==='tutorialBack'){tutorialStep=Math.max(0,tutorialStep-1);tutorialChoice='';tutorialCards=[];render();return;}
 if(id==='tutorialDone'){dialog=null;if(stage==='start')setupOpen=true;render();return;}
 if(id==='closeDialog'){dialog=null;render();return;}
 if(id==='menu'){dialog={type:'menu'};render();return;}
 if(id==='restart'){dialog={type:'home-confirm'};render();return;}
 if(id==='begin'){const config={count:Number(val('count')),mode:val('startMode')??'others',seed:val('seed')?.trim()?Number(val('seed')):undefined};if(hasSaved){pendingStart=config;dialog={type:'overwrite-confirm'};render();}else beginNewGame(config);return;}
 if(id==='confirmNew'){if(pendingStart)beginNewGame(pendingStart);return;}
 if(id==='resume'){stage='game';dialog=null;screenTab='board';render();return;}
 if(id==='cpuResume'){cpuRunning=true;cpuBudget=300;render();setTimeout(tickCpu,0);return;}

 if(id==='new'){pauseMeasurement();playtestClock=null;feedbackDraft='';cpuRunning=false;try{s=createCrossRiverGame({count:Number(val('count')),seed:val('seed')?.trim()?Number(val('seed')):undefined,instinctScope:val('instinct'),supportDrawCount:Number(val('drawCount')),placementProfile:'main-three'});s.game.metadata.cpuMode='others';try{localStorage.setItem(clockKey,'');}catch{}error='';selectedUnit=null;selectedArea='a0';plans={};indices=[];benchSelection=[];storage();}catch(x){error=message(x);}render();}
 if(id==='feedbackSave'){try{if(!playtestClock)playtestClock=pausePlaytestClock(startPlaytestClock({gameKey:measurementGameKey(),startRound:s.round,measurementNotStarted:true}));playtestClock=recordPlaytestFeedback(playtestClock,{text:feedbackDraft,kind:feedbackKind,round:s.round,phase:s.game.phase,player:decisionPlayer(),area:selectedArea,individual:selectedUnit,commandCount:s.game.commands.length});feedbackDraft='';error='';storage();persistMeasurement();}catch(x){error=message(x);}render();}
 if(id==='clockStart'){playtestClock=startPlaytestClock({gameKey:measurementGameKey(),count:s.players.length,seed:s.game.metadata.seed,board:s.game.metadata.boardProfile??'legacy',placementProfile:s.placementProfile??'five',startRound:s.round,cpuMode:s.game.metadata.cpuMode??'manual'});storage();persistMeasurement();render();}
 if(id==='clockToggle'){delete playtestClock.metadata.measurementNotStarted;playtestClock=playtestClock.running?pausePlaytestClock(playtestClock):resumePlaytestClock(playtestClock);persistMeasurement();render();}
 if(id==='clockExport'){const blob=new Blob([JSON.stringify({...playtestClockExport(playtestClock),gameSave:JSON.parse(serializeGame(s))},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SAFARIUM_playtest_time.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
 if(id==='help'){tutorialStep=0;tutorialChoice='';tutorialCards=[];dialog={type:'help'};render();return;}
 if(id==='closeGuide'){showGuide=false;render();}
 if(id==='cpuStep'){try{stepCpu();}catch(x){error=message(x);render();}}
 if(id==='cpuRun'){cpuRunning=!cpuRunning;cpuBudget=300;if((s.game.metadata.cpuMode??'manual')==='manual')s.game.metadata.cpuMode='all';render();if(cpuRunning)setTimeout(tickCpu,0);}
 if(id==='chimpRefresh')doCommand({type:'chimpRefresh',player:currentPlayer(s),individual:val('chimpSource'),indices:[...indices]});
 if(id==='redeploy')doCommand({type:'redeploy',player:currentPlayer(s),individuals:[...benchSelection],...(val('nurseryTarget')?{support:{card:'S30',target:val('nurseryTarget')}}:{})});
 if(id==='pick')doCommand({type:'pick',player:currentPlayer(s),indices});
 if(id==='place')doCommand({type:'place',player:currentPlayer(s),placements:s.game.pending.units.map(id=>plans[id])});
 if(id==='support'){const player=s.game.phase==='defense'?s.game.pending.defender:currentPlayer(s);doCommand({type:'support',player,card:s.hands[player][Number(val('supportCard'))],...(val('supportTarget')?{target:val('supportTarget')}:{indices:[...indices]})});}
 if(id==='resolveAttack')doCommand({type:'resolveAttack',player:s.game.pending.defender});
 if(id==='blockadeDemo'){dialog=null;screenTab='action';stage='game';pauseMeasurement();playtestClock=null;s=createPlayDemo('blockade');plans={};indices=[];benchSelection=[];error='';selectedUnit=null;movementSupport='';declarationQueue=[];arrivalQueue=[];storage();render();}
 if(id==='defenseDemo'){dialog=null;screenTab='action';stage='game';pauseMeasurement();playtestClock=null;s=createPlayDemo('defense');plans={};indices=[];benchSelection=[];error='';selectedUnit=null;storage();render();}
 if(id==='pass')doCommand({type:'pass',player:currentPlayer(s)});
 if(id==='queueMovement'){if(movementSupport)movementPermits.push({card:movementSupport});movementSupport='';render();}
 if(id==='clearMovement'){movementPermits=[];render();}
 if(id==='queueDeclaration'){declarationQueue.push({card:val('declarationCard'),target:val('declarationTarget')});render();}
 if(id==='clearDeclaration'){declarationQueue=[];render();}
 if(id==='queueArrival'){arrivalQueue.push({card:val('arrivalCard'),target:val('arrivalTarget'),to:val('arrivalTo')});render();}
 if(id==='clearArrival'){arrivalQueue=[];render();}
 if(id==='move'){const moves=availableMoves(s,currentPlayer(s),moveOptions()).filter(m=>m.individual===selectedUnit&&m.path.at(-1)===selectedArea);if(moves[Number(val('moveChoice'))])doCommand({...moves[Number(val('moveChoice'))],arrivalSupports:[...arrivalQueue]});}
 if(id==='role')doCommand({type:'roles',player:currentPlayer(s),area:s.animals[selectedUnit].area,assignments:{[selectedUnit]:val('soloRole')}});
 if(id==='swap'){const other=val('swapWith');if(other)doCommand({type:'roles',player:currentPlayer(s),area:s.animals[selectedUnit].area,assignments:{[selectedUnit]:s.animals[other].role,[other]:s.animals[selectedUnit].role}});}
 if(id==='save'){storage();hasSaved=true;error='';render();}if(id==='load'){stage='game';dialog=null;screenTab='board';cpuRunning=false;pauseMeasurement();try{s=restoreGame(localStorage.getItem(key)??'');loadMeasurement();plans={};indices=[];benchSelection=[];selectedUnit=null;error='';}catch(x){error=message(x);}render();}
 if(id==='export'){const blob=new Blob([serializeGame(s)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SAFARIUM_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
 if(id==='import')document.getElementById('file').click();
});
render();

if(typeof window!=='undefined')window.addEventListener('pagehide',()=>{pauseMeasurement();storage();});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog=null;render();}});


function powerLogUI(limit=15){const rows=s.events.filter(e=>['power-snapshot','round-power-snapshot'].includes(e.type)).slice(-limit).reverse();return rows.length?`<details><summary>ラウンド・移動の支配力と領土ログ</summary>${rows.map(e=>{const entries=Object.entries(e.areas).filter(([a,x])=>e.type==='round-power-snapshot'||JSON.stringify(x.before)!==JSON.stringify(x.after));return `<p><b>R${e.round} ${e.type==='round-power-snapshot'?'支配確定':e.command==='move'?'遊撃の進出':e.command==='roles'?'役割変更':'支配力の変化'}</b></p>${entries.map(([a,x])=>`<p>${coord(a)}：${s.players.map(p=>shortPlayer(p)+' '+(x.sums?x.sums[p]:x.before[p]+'→'+x.after[p])).join(' ／ ')} · 確定 ${shortPlayer(x.controller??x.confirmed)}</p>`).join('')}`;}).join('')}</details>`:'';}

return {};})();</script></body></html>
